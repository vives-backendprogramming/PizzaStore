# Production Profile Configuration

# MongoDB Connection
# Never commit production credentials: the complete connection string (with user and password) comes from the
# environment variable MONGODB_URI, e.g. mongodb://pizzastore:secret@db.example.com:27017/pizzastore_prod
# The value after ':' is only a default for a local server without authentication.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzastore_prod}

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
file.upload-dir=/var/www/pizzastore/uploads/pizzas
file.base-url=https://pizzastore.example.com
