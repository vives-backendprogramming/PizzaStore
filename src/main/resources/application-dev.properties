# Development Profile Configuration

# MongoDB Connection - a local MongoDB server, e.g. started with Docker:
#   docker run -d --name pizzastore-mongo -p 27017:27017 mongo:8.0
# Spring Boot 4 property name: spring.mongodb.* (spring.data.mongodb.uri is the deprecated Spring Boot 3 name)
spring.mongodb.uri=mongodb://localhost:27017/pizzastore_dev

# Seed data: DataSeeder (profile dev) fills an empty database at startup.
# To start over, drop the database, e.g.: mongosh pizzastore_dev --eval "db.dropDatabase()"

# Logging Configuration: the queries Spring Data MongoDB sends (the counterpart of spring.jpa.show-sql)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
file.upload-dir=uploads/pizzas
file.base-url=http://localhost:8080
