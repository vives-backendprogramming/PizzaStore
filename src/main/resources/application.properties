# Application Name
spring.application.name=pizzastore-with-swagger

# Active Profile
spring.profiles.active=dev

# Server Configuration
server.port=8080

# MongoDB (the connection itself is per profile: spring.mongodb.uri in application-dev/prod.properties)
# Create the indexes declared with @Indexed (unique e-mail address and order number) at startup: off by default
spring.data.mongodb.auto-index-creation=true
# Store BigDecimal as BSON Decimal128, a real decimal number: price queries (findByPriceLessThan, ...) compare
# numbers and the aggregation in OrderRepository can $sum them. Spring Boot 4 already does this by default; it is set
# explicitly because Spring Boot 3 stored a BigDecimal as a String, and as a string "10.99" < "8.99".
spring.data.mongodb.representation.big-decimal=decimal128

# Logging Configuration
logging.level.root=INFO
logging.level.be.vives.pizzastore=DEBUG
logging.level.org.springframework.web=INFO

# Jackson Configuration (JSON)
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Europe/Brussels

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration: HMAC-SHA key (at least 256 bits) and token lifetime in milliseconds (24 h).
# Never commit a real secret: in production set the environment variable JWT_SECRET; the value after ':' is a development default.
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong}
jwt.expiration=86400000

# CORS: browser front-ends that may call the API from another origin (comma separated)
pizzastore.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# success responses are JSON: without this an @ApiResponse without mediaType is documented as */*
springdoc.default-produces-media-type=application/json

# Open Food Facts (declarative HTTP client, group "openfoodfacts" - see HttpClientConfig)
# Open Food Facts requires a User-Agent of the form AppName/Version (contact), and allows 15 product lookups per minute per IP
spring.http.serviceclient.openfoodfacts.base-url=https://world.openfoodfacts.org
spring.http.serviceclient.openfoodfacts.default-header.User-Agent=PizzaStore/1.0 (pizzastore-course@example.com)
spring.http.serviceclient.openfoodfacts.connect-timeout=2s
spring.http.serviceclient.openfoodfacts.read-timeout=5s
